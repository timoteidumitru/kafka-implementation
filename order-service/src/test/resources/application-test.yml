# ======================================================
# INTEGRATION TEST ENVIRONMENT
# ======================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  outbox:
    recovery:
      # Prevents background tasks from changing test data.
      enabled: false

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.0
