# ======================================================
# ORDER SERVICE - SHARED CONFIGURATION
# ======================================================

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:order-service}

  # Load resilience policies for all environments.
  config:
    import: "classpath:application-resilience.yml"

  # ----------------------------------------------------
  # DATABASE
  # Connection details belong to environment profiles.
  # ----------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Safe default; local and test profiles override.
      # Production schema changes should use migrations.
      ddl-auto: validate
    show-sql: false

  # ----------------------------------------------------
  # KAFKA
  # Broker address belongs to environment profiles.
  # ----------------------------------------------------
  kafka:
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:order-service}
      auto-offset-reset: ${SPRING_KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.kafka_implementation.shared_events.inventory,com.kafka_implementation.shared_events.payment"

    # Observation is configured on the KafkaTemplate
    # and listener container, not producer/consumer.
    template:
      observation-enabled: true

    listener:
      concurrency: 3
      poll-timeout: 3s
      ack-mode: batch
      observation-enabled: true

# ======================================================
# APPLICATION SETTINGS
# ======================================================
app:
  outbox:
    recovery:
      # Explicit opt-in per environment.
      enabled: false
      batch-size: 100
      fixed-delay-ms: 10000

  # Keep this prefix until the Java topic configuration
  # bindings have been reviewed.
  topics:
    order-events: order.events.v1
    order-events-dlt: order.events.v1.DLT
    payment-events: payment.events.v1
    inventory-events: inventory.events.v1
    notification-events: notification.events.v1

# ======================================================
# ACTUATOR / OBSERVABILITY
# ======================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
