# ======================================================
# RESILIENCE4J - ORDER SERVICE
# ======================================================

resilience4j:
  circuitbreaker:
    instances:
      order-kafka:
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s

  retry:
    instances:
      order-kafka:
        max-attempts: 3
        wait-duration: 500ms

  bulkhead:
    instances:
      order-kafka:
        max-concurrent-calls: 5
        max-wait-duration: 0
